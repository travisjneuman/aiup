name: Catalog or tool request
description: Propose a tool for the catalog or a correction to an existing catalog entry.
title: "[Catalog] "
body:
  - type: input
    id: tool
    attributes:
      label: Tool and stable identifier
      placeholder: Example Tool (`example-tool`)
    validations:
      required: true
  - type: input
    id: canonical
    attributes:
      label: Canonical project URL
      description: Link to the official repository or vendor documentation.
    validations:
      required: true
  - type: textarea
    id: lifecycle
    attributes:
      label: macOS lifecycle evidence
      description: Document official install, version/update, and remove paths. Note architecture, macOS, account, and package-manager requirements.
    validations:
      required: true
  - type: textarea
    id: linux
    attributes:
      label: Linux install sources
      description: List each official source with its package name and a link. aiup reads pacman or AUR, apt, dnf, Flatpak, Snap, Linuxbrew, npm, uv, pipx, cargo, go, nix, an official install script, and the tool's own updater. Note any repository setup a package needs. Leave it empty if there is no Linux build.
  - type: textarea
    id: windows
    attributes:
      label: Windows install sources
      description: List each official source with its package id and a link. aiup reads winget (`Publisher.Package` or `msstore:<id>`), Scoop (`bucket/app`), Chocolatey, npm, uv, pipx, cargo, go, an official PowerShell install script, and the tool's own updater. Leave it empty if there is no Windows build.
  - type: textarea
    id: rationale
    attributes:
      label: Why it belongs
      description: Explain the category fit and how the proposal avoids duplicating an existing entry.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Contract boundaries
      options:
        - label: Each Linux and Windows source I listed comes from the project's own docs or the package's official listing.
          required: true
        - label: I have not assumed telemetry, privilege escalation, destructive cleanup, or universal settings preservation.
          required: true
