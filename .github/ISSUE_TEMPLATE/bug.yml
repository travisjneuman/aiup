name: Bug report
description: Report a reproducible problem with aiup on macOS, Linux or Windows.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a focused aiup problem. Do not include credentials, private inventory, or unredacted personal paths.
  - type: input
    id: version
    attributes:
      label: aiup version
      description: Run `aiup version` and paste only the version.
      placeholder: 2026.08.25-02
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System version and architecture
      description: On Linux, include the distribution.
      placeholder: macOS 14.7, Apple Silicon / Ubuntu 24.04, x86_64 / Windows 11 24H2, ARM64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest commands or picker actions that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: aiup doctor output
      description: Run `aiup doctor` and paste the output after removing usernames, home paths, and private inventory. If aiup does not start, say so here.
      render: text
  - type: textarea
    id: evidence
    attributes:
      label: Other redacted evidence
      description: Add any other relevant output after removing usernames, home paths, tokens, private inventory, and unrelated logs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Privacy check
      options:
        - label: This report contains no credentials, private inventory, or unredacted personal paths.
          required: true
