name: Bug report
description: Report a reproducible problem with the current macOS implementation.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a focused aiup problem. Do not include credentials, private inventory, or unredacted personal paths.
  - type: input
    id: version
    attributes:
      label: aiup version
      description: Run `aiup version` and paste only the version.
      placeholder: 2026.08.25-02
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and architecture
      placeholder: macOS 14.7, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest commands or picker actions that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add relevant output after removing usernames, home paths, tokens, private inventory, and unrelated logs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Scope check
      options:
        - label: This affects the current macOS implementation, not an unimplemented Linux or Windows port.
          required: true
        - label: This report contains no credentials, private inventory, or unredacted personal paths.
          required: true
